name: Build and deploy

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      ref:
        description: '빌드·배포할 브랜치, 태그 또는 커밋 SHA'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: justcalc-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy on M2
    runs-on: [self-hosted, bongbong-MacBookPro-M2]
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://calc.bongworks.co.kr
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      DEPLOY_ROOT: ${{ vars.JUSTCALC_DEPLOY_ROOT }}
      SERVICE_PORT: '34560'
      SERVICE_HOST: 0.0.0.0
      LAUNCHD_LABEL: com.bongworks.justcalc

    steps:
      - name: Check out the selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Require release tag format
        if: github.event_name == 'push'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^release-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use release-X.Y.Z (received: $GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and unit quality gates
        run: |
          pnpm lint
          pnpm check:catalog
          pnpm check:privacy
          pnpm test

      - name: Build and verify without analytics
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ''
        run: |
          pnpm build
          pnpm check:static

      - name: Install Chromium for static E2E tests
        run: pnpm exec playwright install chromium

      - name: Run static E2E tests
        run: pnpm test:e2e

      - name: Verify the synthetic analytics build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST123456
        run: |
          pnpm build
          pnpm check:static -- --ga-fixture
          E2E_GA_PRODUCTION=1 pnpm test:e2e:analytics

      - name: Build the release artifact
        run: |
          pnpm build
          pnpm check:static

      - name: Prepare release metadata
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            release_name="$GITHUB_REF_NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            release_name="manual-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Atomically deploy and restart launchd
        env:
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: deploy/deploy-on-runner.sh "$GITHUB_WORKSPACE/out"
